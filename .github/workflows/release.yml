name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    # New repositories default to a read-only GITHUB_TOKEN, which cannot attach release assets.
    # Granting it here keeps the workflow working regardless of the repo's default setting.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the file
        run: npm run build

      - name: Compress dist
        run: gzip -kf dist/section-highlighter.js

      - name: Upload build artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
