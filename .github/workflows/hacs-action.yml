name: HACS validation

# The HACS action validates the repository through GitHub's API, not the checked-out workspace.
# Two consequences:
#
#  1. No pull_request trigger. A PR from a fork would validate the fork, which has no releases,
#     and fail while the contributor's code is fine. build.yml covers code on PRs.
#  2. For a plugin, HACS wants either a committed `dist/section-highlighter.js` or a published
#     GitHub release. The bundle is a build output and is gitignored, so this check stays red
#     until a full (non-prerelease) release exists — pre-releases are not counted. Expect a
#     failure for as long as the only releases are alphas or betas.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
